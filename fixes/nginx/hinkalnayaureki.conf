# Усиленный конфиг nginx для hinkalnayaureki.ru
# Реализует исправления R-1..R-7 из security/04-remediation.md
#
# ВНИМАНИЕ:
#  1) server_tokens off; нужно задать в http {} (файл /etc/nginx/nginx.conf) — см. ниже.
#  2) CSP выкатывайте поэтапно: сначала строку Content-Security-Policy-Report-Only,
#     убедитесь, что сайт работает, затем переключайтесь на боевой Content-Security-Policy.
#  3) Пути к сертификатам/корню сайта подставьте свои.
#  4) Проверка перед применением:  sudo nginx -t  &&  sudo systemctl reload nginx
#
# --- В /etc/nginx/nginx.conf, блок http { ... }, добавьте: ---
#   server_tokens off;                       # R-4: скрыть версию nginx (F-6)

# ==== HTTP :80 — только редирект на HTTPS (R-1: HSTS здесь НЕ добавляем) ====
server {
    listen 80;
    listen [::]:80;
    server_name hinkalnayaureki.ru www.hinkalnayaureki.ru;
    return 301 https://hinkalnayaureki.ru$request_uri;
}

# ==== HTTPS :443 ====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hinkalnayaureki.ru www.hinkalnayaureki.ru;

    root /var/www/hinkalnayaureki;   # <-- путь к собранному SPA (dist)
    index index.html;

    # ---- TLS (R-5) ----
    ssl_certificate     /etc/letsencrypt/live/hinkalnayaureki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hinkalnayaureki.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Заголовки безопасности (R-1, R-3) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ---- CSP (R-2) ----
    # ШАГ 1 (рекомендуется сначала): только отчёт, ничего не блокирует.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    #
    # ШАГ 2 (после проверки): боевой режим.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    # Примечание: если из-за инлайновых стилей React «поедет» вёрстка —
    # временно добавьте 'unsafe-inline' в style-src (лучше style-src-attr 'unsafe-inline').
    # connect-src расширьте доменом API, если backend заказа на отдельном хосте.

    # ---- Хешированные ассеты: иммутабельный кэш + честный 404 (R-6, F-8) ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---- security.txt как реальный файл (R-7, F-9) ----
    # положите fixes/well-known/security.txt в $root/.well-known/security.txt
    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # ---- SPA-маршруты: fallback на index.html ----
    location / {
        try_files $uri /index.html;
    }
}
