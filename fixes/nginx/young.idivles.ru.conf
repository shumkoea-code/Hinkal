# Точечное усиление для young.idivles.ru (Next.js за nginx/1.22.1)
#
# Сайт уже отдаёт хороший набор заголовков (HSTS, CSP, X-Frame-Options: DENY,
# X-Content-Type-Options, Referrer-Policy, Cache-Control: no-store). Ниже —
# ТОЛЬКО недостающие правки. Применять после проверки, где именно ставятся
# заголовки: в nginx или в самом Next.js (next.config.js / middleware).
#
# Проверка/перезапуск: sudo nginx -t && sudo systemctl reload nginx
#
# --- В /etc/nginx/nginx.conf, блок http { }: ---
#   server_tokens off;      # скрыть версию nginx (сейчас видно nginx/1.22.1)
#
# --- В server/location, где проксируется Next.js: ---
#   ВАЖНО про add_header в nginx: если в этом же контексте уже есть другие
#   add_header, добавляйте новые РЯДОМ с ними (иначе унаследованные заголовки
#   пропадут). Если заголовки ставит сам Next.js — см. next.config.js ниже.

location / {
    # скрыть, что бэкенд — Next.js (сейчас есть заголовок X-Powered-By: Next.js)
    proxy_hide_header X-Powered-By;

    # недостающий заголовок политики доступа к API браузера
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ... существующий proxy_pass и прочие директивы оставить как есть ...
    # proxy_pass http://127.0.0.1:3000;
}

# security.txt как реальный файл (сейчас его нет)
# положить fixes/well-known/security.txt в webroot/.well-known/security.txt
location = /.well-known/security.txt {
    default_type text/plain;
    root /var/www/young.idivles.ru;   # <-- поправить под реальный путь
    try_files $uri =404;
}
