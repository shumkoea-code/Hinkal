# Сайт + VLESS/gRPC на одном 443 для v1.idivles.ru
#
# Архитектура:
#   браузер  --TLS--> :443  --> location /     --> сайт
#   VLESS    --TLS--> :443  --> location /gun  --> grpc://127.0.0.1:10443
#
# Xray inbound "Telegram" должен оставаться:
#   listen 127.0.0.1:10443
#   network=grpc, serviceName=gun, security=none
#
# После установки:
#   nginx -t && systemctl reload nginx
# В панели 3X-UI Host для inbound Telegram:
#   port=443, security=tls, sni=v1.idivles.ru, fingerprint=chrome

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name v1.idivles.ru;

    # для certbot, если обновляете сертификаты через webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: сайт + gRPC
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v1.idivles.ru;

    # Те же сертификаты, что уже использует панель 3X-UI
    ssl_certificate     /root/cert/v1.idivles.ru/fullchain.pem;
    ssl_certificate_key /root/cert/v1.idivles.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- VLESS gRPC (serviceName = gun) ----
    # multiMode у Xray использует /gun/TunMulti, обычный режим — /gun/Tun
    location ^~ /gun {
        grpc_pass grpc://127.0.0.1:10443;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;

        # если nginx собран без http_v2 / grpc — эта секция не взлетит
        # тогда ставьте пакет nginx-full и модуль http_v2_module
    }

    # ---- САЙТ ----
    # Вариант A: статический сайт
    root /var/www/v1.idivles.ru;
    index index.html index.htm index.php;

    location / {
        try_files $uri $uri/ /index.html;
        # если это PHP-сайт (WordPress и т.п.), закомментируйте try_files выше
        # и раскомментируйте блок PHP ниже
    }

    # Вариант B: PHP-FPM (раскомментируйте при необходимости)
    # location / {
    #     try_files $uri $uri/ /index.php?$query_string;
    # }
    # location ~ \.php$ {
    #     include snippets/fastcgi-php.conf;
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    # }

    # Вариант C: прокси на локальное приложение (Node/Docker и т.п.)
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # безопасность / служебное
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/v1.idivles.ru.access.log;
    error_log  /var/log/nginx/v1.idivles.ru.error.log;
}
