# Локальный HTTPS для v1.idivles.ru (достигается только через stream SNI → 8445).
# Браузер с SNI=v1.idivles.ru видит обычный сайт.
# VLESS-клиент с security=tls и path/serviceName=gun ходит в location /gun → Xray.
# Клиенты security=none (без TLS) по-прежнему идут в stream default → 127.0.0.1:10443.
# Актуальная копия с сервера на 2026-08-12.

server {
    listen 127.0.0.1:8445 ssl http2;
    server_name v1.idivles.ru;

    ssl_certificate     /root/cert/v1.idivles.ru/fullchain.pem;
    ssl_certificate_key /root/cert/v1.idivles.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # VLESS gRPC (serviceName=gun, multiMode → /gun/TunMulti)
    location ^~ /gun {
        grpc_pass grpc://127.0.0.1:10443;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
    }

    # Маскировочная страница (чтобы v1.idivles.ru выглядел как обычный сайт)
    root /var/www/v1.idivles.ru;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/v1.idivles.ru.access.log;
    error_log  /var/log/nginx/v1.idivles.ru.error.log;
}
