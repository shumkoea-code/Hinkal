# Локальный HTTPS для v1.idivles.ru (stream SNI → 8445).
# Браузер: маскировочный сайт.
# Телефон Mobile-TLS-WS: location /c410aeaf855fdf46bb88 → Xray WS
# Mobile/Legacy gRPC+TLS: location /gun → Xray gRPC

server {
    listen 127.0.0.1:8445 ssl http2;
    server_name v1.idivles.ru;

    ssl_certificate     /root/cert/v1.idivles.ru/fullchain.pem;
    ssl_certificate_key /root/cert/v1.idivles.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    location /c410aeaf855fdf46bb88 {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10447;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /gun {
        grpc_pass grpc://127.0.0.1:10443;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
    }

    root /var/www/v1.idivles.ru;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/v1.idivles.ru.access.log;
    error_log  /var/log/nginx/v1.idivles.ru.error.log;
}
