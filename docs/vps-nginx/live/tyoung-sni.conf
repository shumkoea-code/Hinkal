# SNI-мультиплексор :443 (stealth edition)
#  tyoung.idivles.ru     → сайт портала
#  v1.idivles.ru         → маскировочная страница (+ /gun legacy TLS-gRPC)
#  www.cloudflare.com    → Stealth Reality+XHTTP (основной VPN)
#  cloudflare.com/apple  → тот же Reality
#  default / без TLS     → LEGACY gRPC security=none (старые клиенты)
map $ssl_preread_server_name $yp_backend {
    tyoung.idivles.ru   127.0.0.1:8443;
    v1.idivles.ru       127.0.0.1:8445;
    www.cloudflare.com  127.0.0.1:10444;
    cloudflare.com      127.0.0.1:10444;
    www.apple.com       127.0.0.1:10444;
    apple.com           127.0.0.1:10444;
    default             127.0.0.1:10443;
}
server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    proxy_pass $yp_backend;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 86400s;
}
