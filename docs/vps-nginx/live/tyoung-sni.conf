# SNI-мультиплексор :443
#  tyoung.idivles.ru              → сайт портала
#  v1.idivles.ru                  → маскировочная страница
#  www.cloudflare.com / cf        → STEALTH  Reality+XHTTP   (:10444)
#  www.apple.com / icloud         → SPEED    Reality+TCP+Vision (:10445)
#  www.samsung.com                → ALT      Reality+XHTTP   (:10446)
#  default / без TLS              → LEGACY   gRPC none       (:10443)
map $ssl_preread_server_name $yp_backend {
    tyoung.idivles.ru    127.0.0.1:8443;
    v1.idivles.ru        127.0.0.1:8445;

    www.cloudflare.com   127.0.0.1:10444;
    cloudflare.com       127.0.0.1:10444;

    www.apple.com        127.0.0.1:10445;
    apple.com            127.0.0.1:10445;
    gateway.icloud.com   127.0.0.1:10445;
    www.icloud.com       127.0.0.1:10445;

    www.samsung.com      127.0.0.1:10446;
    samsung.com          127.0.0.1:10446;

    default              127.0.0.1:10443;
}
server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    proxy_pass $yp_backend;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 86400s;
}
