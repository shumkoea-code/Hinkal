# /etc/nginx/sites-available/wg-panel
# TLS admin UI for WireGuard panel (not on :443 — separate port)

server {
    listen 8447 ssl http2;
    listen [::]:8447 ssl http2;
    server_name v1.idivles.ru;

    ssl_certificate     /root/cert/v1.idivles.ru/fullchain.pem;
    ssl_certificate_key /root/cert/v1.idivles.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WGSSL:10m;
    server_tokens off;

    limit_conn wgpanel_conn 15;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /login {
        limit_req zone=wgpanel_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:$server_port;
    }

    location / {
        limit_req zone=wgpanel_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:$server_port;
    }
}
