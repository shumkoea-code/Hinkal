{% extends "base.html" %}
{% block title %}Вход · WG Panel{% endblock %}
{% block body %}
<div class="login-box card">
  <h1>Вход</h1>
  <p class="muted tiny">После {{ ban_after }} ошибок IP блокируется на час.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" class="stack" style="margin-top:12px">
    <div><label class="muted">Логин</label><input name="username" autocomplete="username" required autofocus></div>
    <div><label class="muted">Пароль</label><input type="password" name="password" autocomplete="current-password" required></div>
    <button type="submit" class="block">Войти</button>
  </form>
</div>
{% endblock %}
