<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}WG Panel{% endblock %}</title>
  <style>
    :root { --bg:#0f1419; --card:#1a222c; --text:#e7eef7; --muted:#8fa3b8; --acc:#3d9cf0; --ok:#3ecf8e; --err:#f07178; --line:#2a3542; }
    *{box-sizing:border-box} body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1a2a3a,var(--bg));color:var(--text);min-height:100vh}
    a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
    .wrap{max-width:980px;margin:0 auto;padding:24px}
    .nav{display:flex;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
    .nav .brand{font-weight:700;letter-spacing:.02em}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
    h1,h2{margin:0 0 12px} .muted{color:var(--muted)}
    input,button,select{font:inherit} input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e151c;color:var(--text)}
    button,.btn{display:inline-block;padding:10px 14px;border-radius:10px;border:0;background:var(--acc);color:#041018;font-weight:600;cursor:pointer}
    button.secondary,.btn.secondary{background:#2a3542;color:var(--text)}
    button.danger{background:var(--err);color:#1a0505}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:720px){.row{grid-template-columns:1fr}}
    table{width:100%;border-collapse:collapse} th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .flash{padding:10px 12px;border-radius:10px;margin-bottom:12px} .flash.ok{background:#123226;color:var(--ok)} .flash.error{background:#3a1518;color:var(--err)}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#243041;font-size:12px}
    .pill.on{background:#143526;color:var(--ok)} .pill.off{background:#3a1518;color:var(--err)}
    code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
    pre{background:#0e151c;padding:12px;border-radius:10px;overflow:auto;border:1px solid var(--line)}
    .login-box{max-width:400px;margin:12vh auto}
  </style>
</head>
<body>
  <div class="wrap">
    {% if session.get('admin') %}
    <div class="nav">
      <div class="brand">WG Panel · idivles</div>
      <a href="{{ url_for('dashboard') }}">Пиры</a>
      <a href="{{ url_for('instructions') }}">Инструкция</a>
      <span class="muted" style="margin-left:auto">{{ session.get('user') }}</span>
      <a href="{{ url_for('logout') }}">Выход</a>
    </div>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
