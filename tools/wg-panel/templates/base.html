<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b1220"/>
  <title>{% block title %}WG Panel{% endblock %}</title>
  <style>
    :root {
      --bg:#0b1220; --card:#121a27; --text:#e8eef7; --muted:#8b9bb0;
      --acc:#2f9eef; --acc2:#1b6ca8; --ok:#3ecf8e; --warn:#e6b35a; --err:#f07178;
      --line:#243044; --tap:44px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text);min-height:100vh;min-height:100dvh;
      background:
        radial-gradient(900px 480px at 8% -8%, #16324f 0%, transparent 55%),
        radial-gradient(700px 420px at 100% 0%, #0f2a22 0%, transparent 50%),
        linear-gradient(180deg, #0d1522, var(--bg));
      padding-bottom:calc(18px + var(--safe-b));
    }
    a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
    .wrap{max-width:1100px;margin:0 auto;padding:14px 14px 28px;padding-top:calc(14px + var(--safe-t))}
    .nav{
      display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
      position:sticky;top:0;z-index:20;padding:10px 0;backdrop-filter:blur(10px);
      background:rgba(11,18,32,.88);border-bottom:1px solid transparent;
    }
    .nav .brand{font-weight:750;letter-spacing:.02em;font-size:15px;margin-right:4px}
    .nav a{
      color:var(--muted);padding:8px 10px;border-radius:10px;min-height:var(--tap);
      display:inline-flex;align-items:center;font-size:14px;
    }
    .nav a:hover{color:var(--text);background:#1a2433;text-decoration:none}
    .nav .spacer{flex:1}
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card);
      border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;
      box-shadow:0 10px 40px rgba(0,0,0,.18);
    }
    h1{margin:0 0 8px;font-size:1.25rem;line-height:1.25;word-break:break-word}
    h2{margin:0 0 12px;font-size:1.05rem}
    .muted{color:var(--muted)} .tiny{font-size:12px}
    label.muted{display:block;margin-bottom:4px;font-size:12px}
    input,button,select,textarea{font:inherit;touch-action:manipulation}
    input,select,textarea{
      width:100%;padding:12px 12px;border-radius:12px;border:1px solid var(--line);
      background:#0a111b;color:var(--text);min-height:var(--tap);font-size:16px;
    }
    textarea{min-height:72px;resize:vertical}
    button,.btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:12px 14px;border-radius:12px;border:0;min-height:var(--tap);
      background:linear-gradient(180deg, var(--acc), var(--acc2));color:#041018;font-weight:700;cursor:pointer;
      font-size:15px;text-align:center;
    }
    button.secondary,.btn.secondary{background:#243044;color:var(--text);font-weight:600}
    button.danger{background:var(--err);color:#1a0505}
    button.block,.btn.block{width:100%}
    button:disabled{opacity:.5;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
    table{width:100%;border-collapse:collapse;min-width:520px}
    th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{color:var(--muted);font-size:12px;font-weight:600}
    .flash{padding:12px;border-radius:12px;margin-bottom:12px;word-break:break-word}
    .flash.ok{background:#123226;color:var(--ok)}
    .flash.error{background:#3a1518;color:var(--err)}
    .pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#243041;font-size:12px;margin:2px 2px 0 0}
    .pill.on{background:#143526;color:var(--ok)} .pill.off{background:#3a1518;color:var(--err)}
    .pill.warn{background:#3a2e12;color:var(--warn)}
    code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
    pre{background:#0a111b;padding:12px;border-radius:10px;overflow:auto;border:1px solid var(--line);max-width:100%;-webkit-overflow-scrolling:touch}
    .login-box{max-width:420px;margin:8vh auto}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
    .stat{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(18,26,39,.85)}
    .stat .v{font-size:1.2rem;font-weight:750;margin-top:4px}
    .bar{height:8px;background:#0a111b;border-radius:99px;overflow:hidden;margin-top:6px}
    .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:99px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
    .actions > form{display:flex}
    .actions button,.actions .btn{flex:1 1 auto}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .chip-row form{flex:1 1 calc(50% - 8px);min-width:120px}
    .chip-row button{width:100%}
    .peer-cards{display:none}
    .peer-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#0e1622}
    .peer-card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .peer-card .meta{margin-top:8px}
    .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .seg label{
      display:flex;align-items:center;justify-content:center;text-align:center;
      min-height:var(--tap);padding:8px 6px;border-radius:12px;border:1px solid var(--line);
      background:#0a111b;color:var(--muted);font-size:13px;cursor:pointer;
    }
    .seg input{position:absolute;opacity:0;pointer-events:none}
    .seg input:checked + span, .seg label:has(input:checked){
      border-color:var(--acc);color:var(--text);background:#132033;font-weight:650;
    }
    .seg label span{pointer-events:none}
    .qr-wrap{text-align:center}
    .qr-wrap img{max-width:min(220px,70vw);height:auto;background:#fff;padding:8px;border-radius:8px}
    .url-box{word-break:break-all;font-size:12px}
    @media(max-width:820px){
      .row,.row3{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr 1fr}
      .desktop-only{display:none !important}
      .peer-cards{display:block}
      .actions{flex-direction:column}
      .actions > form,.actions > a{width:100%}
      .actions button,.actions .btn{width:100%}
      .nav .brand{width:100%;margin-bottom:2px}
      .seg{grid-template-columns:repeat(2,1fr)}
    }
    @media(min-width:821px){
      .mobile-only{display:none !important}
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% if session.get('admin') %}
    <div class="nav">
      <div class="brand">WG Panel · idivles</div>
      <a href="{{ url_for('dashboard') }}">Пиры</a>
      <a href="{{ url_for('settings_page') }}">Настройки</a>
      <a href="{{ url_for('instructions') }}">Инструкция</a>
      <span class="spacer"></span>
      <span class="muted tiny">{{ session.get('user') }}</span>
      <a href="{{ url_for('logout') }}">Выход</a>
    </div>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
