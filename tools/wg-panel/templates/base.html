<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}WG Panel{% endblock %}</title>
  <style>
    :root {
      --bg:#0b1220; --card:#121a27; --text:#e8eef7; --muted:#8b9bb0;
      --acc:#2f9eef; --acc2:#1b6ca8; --ok:#3ecf8e; --warn:#e6b35a; --err:#f07178;
      --line:#243044; --glow:rgba(47,158,239,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;font:15px/1.5 "Segoe UI",ui-sans-serif,system-ui,sans-serif;
      color:var(--text);min-height:100vh;
      background:
        radial-gradient(900px 480px at 8% -8%, #16324f 0%, transparent 55%),
        radial-gradient(700px 420px at 100% 0%, #0f2a22 0%, transparent 50%),
        linear-gradient(180deg, #0d1522, var(--bg));
    }
    a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
    .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 40px}
    .nav{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
    .nav .brand{font-weight:750;letter-spacing:.02em}
    .nav a{color:var(--muted)} .nav a:hover{color:var(--text)}
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card);
      border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;
      box-shadow:0 10px 40px rgba(0,0,0,.18);
    }
    h1{margin:0 0 8px;font-size:1.35rem} h2{margin:0 0 12px;font-size:1.05rem}
    .muted{color:var(--muted)} .tiny{font-size:12px}
    label.muted{display:block;margin-bottom:4px;font-size:12px}
    input,button,select,textarea{font:inherit}
    input,select,textarea{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
      background:#0a111b;color:var(--text);
    }
    textarea{min-height:72px;resize:vertical}
    button,.btn{
      display:inline-block;padding:10px 14px;border-radius:10px;border:0;
      background:linear-gradient(180deg, var(--acc), var(--acc2));color:#041018;font-weight:700;cursor:pointer;
    }
    button.secondary,.btn.secondary{background:#243044;color:var(--text);font-weight:600}
    button.danger{background:var(--err);color:#1a0505}
    button:disabled{opacity:.5;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    @media(max-width:820px){.row,.row3{grid-template-columns:1fr}}
    table{width:100%;border-collapse:collapse}
    th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{color:var(--muted);font-size:12px;font-weight:600}
    .flash{padding:10px 12px;border-radius:10px;margin-bottom:12px}
    .flash.ok{background:#123226;color:var(--ok)}
    .flash.error{background:#3a1518;color:var(--err)}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#243041;font-size:12px}
    .pill.on{background:#143526;color:var(--ok)} .pill.off{background:#3a1518;color:var(--err)}
    .pill.warn{background:#3a2e12;color:var(--warn)}
    code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
    pre{background:#0a111b;padding:12px;border-radius:10px;overflow:auto;border:1px solid var(--line)}
    .login-box{max-width:420px;margin:12vh auto}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    @media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
    .stat{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(18,26,39,.85)}
    .stat .v{font-size:1.25rem;font-weight:750;margin-top:4px}
    .bar{height:8px;background:#0a111b;border-radius:99px;overflow:hidden;margin-top:6px}
    .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:99px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .sep{height:1px;background:var(--line);margin:16px 0}
  </style>
</head>
<body>
  <div class="wrap">
    {% if session.get('admin') %}
    <div class="nav">
      <div class="brand">WG Panel · idivles</div>
      <a href="{{ url_for('dashboard') }}">Пиры</a>
      <a href="{{ url_for('settings_page') }}">Настройки</a>
      <a href="{{ url_for('instructions') }}">Инструкция</a>
      <span class="muted" style="margin-left:auto">{{ session.get('user') }}</span>
      <a href="{{ url_for('logout') }}">Выход</a>
    </div>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
