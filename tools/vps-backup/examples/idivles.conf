# Profile for v1.idivles.ru / similar VPN+portal VPS
# Usage: sudo bash backup.sh --mode smart --profile examples/idivles.conf

EXTRA_PATHS="/root/cert /root/keenetic-wg /root/hardening-backup-20260812181118"

# Never include backup output or packed junk archives (also auto-added by backup.sh)
SKIP_PATHS="/var/backups/vps-backup /var/backups/junk /tmp /var/cache/apt /var/lib/apt/lists"

# compose files to preserve with .env if present
DOCKER_COMPOSE_FILES="/opt/sochi-portal/docker-compose.yml"

# optional hooks (must be executable)
# CUSTOM_PRE_HOOK=/root/backup-pre.sh
# CUSTOM_POST_HOOK=/root/backup-post.sh
